name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  GO_VERSION: "1.25"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Tidy check
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum \
            || (echo "::error::go.mod/go.sum are stale — run 'make tidy' and commit"; exit 1)

      - name: Build gate tests
        # Behind a build tag, so `go test ./...` never compiles them. Compile
        # them here anyway — a gate that stops building is a gate nobody runs.
        run: go vet -tags gate ./test/gate/

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v2.1

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          input: api/proto
          # Breaking-change detection against main keeps the internal contract
          # honest once nodes and gateways deploy independently.
          breaking_against: "https://github.com/${{ github.repository }}.git#branch=main,subdir=api/proto"

  images:
    needs: [test, lint]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [dfs-meta, dfs-node, dfs-gateway]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          build-args: |
            SERVICE=${{ matrix.service }}
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          push: false
          tags: dfs/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  gates:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Start the stack
        run: docker compose -f deploy/compose/docker-compose.dev.yml up --build -d --wait

      - name: Phase 0 gate — health, readiness, metrics
        run: sh deploy/scripts/smoke.sh

      - name: Phase 0 gate — graceful shutdown exits 0
        run: |
          docker compose -f deploy/compose/docker-compose.dev.yml stop -t 20 dfs-gateway
          code=$(docker inspect dfs-dev-dfs-gateway-1 --format '{{.State.ExitCode}}')
          test "$code" = "0" \
            || (echo "::error::gateway exited $code on SIGTERM, want 0"; exit 1)
          docker compose -f deploy/compose/docker-compose.dev.yml start dfs-gateway

      - name: Phase 1 gate — round trip, dedup, live corruption
        # 256 MiB rather than 1 GiB: the runner's disk is the bottleneck and the
        # invariants under test do not care about the size.
        env:
          NODE_ADDR: localhost:9091
          NODE_DATA_DIR: /var/lib/docker/volumes/dfs-dev_node1-data/_data
          SIZE_MB: "256"
        run: sudo -E env "PATH=$PATH" go test -tags gate -v -count=1 -timeout 20m ./test/gate/

      - name: Logs on failure
        if: failure()
        run: docker compose -f deploy/compose/docker-compose.dev.yml logs

      - name: Tear down
        if: always()
        run: docker compose -f deploy/compose/docker-compose.dev.yml down -v
